name: Build & Release Chanouti Masala APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept preinstalled Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK for Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "Chanouti-Masala-v1.0.${{ github.run_number }}.apk"

      - name: Create GitHub Release & Attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Chanouti Masala v1.0.${{ github.run_number }}"
          body: |
            Automated Android APK build for **Chanouti Masala (चुनौती मसाला)**.
            - Native Kotlin & Jetpack Compose offline app
            - Built from commit `${{ github.sha }}`
          files: "Chanouti-Masala-v1.0.${{ github.run_number }}.apk"
          generate_release_notes: true
